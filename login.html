<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Attendance Alert System - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-header">
      <div class="logo-icon">📋</div>
      <h1>Smart Attendance<br><span>Alert System</span></h1>
    </div>

    <div id="error-msg" class="error-box" style="display:none;">
      ❌ Invalid username or password. Try again.
    </div>

    <form action="/cgi-bin/login.py" method="POST" class="login-form">
      <div class="form-group">
        <label for="username">User ID</label>
        <input type="text" id="username" name="username"
               placeholder="Enter your User ID" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your Password" required />
      </div>

      <button type="submit" class="btn-login">Login →</button>
    </form>

    <p class="hint">Default: admin / admin123</p>
  </div>

  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
